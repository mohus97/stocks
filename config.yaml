scanner:
  minimum_score: 5.0
  cooldown_minutes: 30
  max_candle_age_minutes: 20

risk:
  account_cash_gbp: 1000
  risk_per_trade_pct: 1.00   # ~£10 planned loss per trade
  max_cash_exposure_pct: 50
  atr_stop_multiple: 1.20
  tp1_r_multiple: 1.50
  tp2_r_multiple: 2.50

notifications:
  macos: false
  telegram: true


  # Cash indices — Yahoo during their cash sessions
  - {symbol: ^NDX, name: NASDAQ 100, type: index}
  - {symbol: ^GSPC, name: S&P 500, type: index}
  - {symbol: ^DJI, name: Dow Jones, type: index}
  - {symbol: ^FTSE, name: FTSE 100, type: index}
  - {symbol: ^GDAXI, name: DAX, type: index}

  # Core FX + Gold — Twelve Data 5-minute feed.
  # WTI removed because the current Twelve Data plan does not provide WTI/USD.
  - {symbol: GBPUSD, data_symbol: GBP/USD, name: GBP/USD, type: forex, provider: twelvedata}
  - {symbol: EURUSD, data_symbol: EUR/USD, name: EUR/USD, type: forex, provider: twelvedata}
  - {symbol: USDJPY, data_symbol: USD/JPY, name: USD/JPY, type: forex, provider: twelvedata}
  - {symbol: XAUUSD, data_symbol: XAU/USD, name: Gold XAU/USD, type: metal, provider: twelvedata}

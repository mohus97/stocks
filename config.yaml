scanner:
  # Tightened after 2026-08-25 review: 6.0/8 setups were being allowed to
  # graduate into live entries too easily. Require a stronger 5m base score.
  minimum_score: 6.5
  cooldown_minutes: 30
  max_candle_age_minutes: 20
  index_max_candle_age_minutes: 30
  twelvedata_max_candle_age_minutes: 15
  entry_watch_ttl_minutes: 4

  # Free Twelve Data plan protection:
  # 5 core FX/commodity symbols x 12 scans/hour x 11 hours = ~660 credits/day (under 800/day).
  twelvedata_active_start_hour_uk: 7
  twelvedata_active_end_hour_uk: 18
  twelvedata_sunday_start_hour_uk: 22

risk:
  account_cash_gbp: 987.00
  risk_per_trade_pct: 1.00   # ~£9.87 scanner risk budget while validating live execution
  max_cash_exposure_pct: 50
  atr_stop_multiple: 1.20
  tp1_r_multiple: 1.50
  tp2_r_multiple: 2.50

notifications:
  macos: false
  telegram: true

watchlist:
  # US stocks — Yahoo 5-minute data
  - {symbol: NVDA, name: NVIDIA, type: stock}
  - {symbol: TSLA, name: Tesla, type: stock}
  - {symbol: PLTR, name: Palantir, type: stock}
  - {symbol: AMD, name: AMD, type: stock}
  - {symbol: META, name: Meta, type: stock}
  - {symbol: AMZN, name: Amazon, type: stock}
  - {symbol: AAPL, name: Apple, type: stock}
  - {symbol: MSFT, name: Microsoft, type: stock}
  - {symbol: GOOGL, name: Alphabet, type: stock}
  - {symbol: AVGO, name: Broadcom, type: stock}
  - {symbol: MU, name: Micron, type: stock}
  - {symbol: ARM, name: Arm, type: stock}
  - {symbol: SMCI, name: Super Micro Computer, type: stock}
  - {symbol: COIN, name: Coinbase, type: stock}
  - {symbol: MSTR, name: Strategy, type: stock}
  - {symbol: HOOD, name: Robinhood, type: stock}
  - {symbol: SOFI, name: SoFi, type: stock}
  - {symbol: RDDT, name: Reddit, type: stock}
  - {symbol: NFLX, name: Netflix, type: stock}

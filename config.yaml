scanner:
  # Tightened after 2026-08-25 review: 6.0/8 setups were being allowed to
  # graduate into live entries too easily. Require a stronger 5m base score.
  minimum_score: 6.5
  cooldown_minutes: 30
  max_candle_age_minutes: 7
  index_max_candle_age_minutes: 7
  twelvedata_max_candle_age_minutes: 7
  entry_watch_ttl_minutes: 4

  # Free Twelve Data plan protection:
  # 4 core FX/metal symbols x 12 scans/hour x 11 hours = ~528 credits/day (under 800/day).
  twelvedata_active_start_hour_uk: 7
  twelvedata_active_end_hour_uk: 18
  twelvedata_sunday_start_hour_uk: 22

risk:
  account_cash_gbp: 1002.00
  risk_per_trade_pct: 1.00   # ~£10.02 scanner risk budget while validating live execution
  max_cash_exposure_pct: 50
  atr_stop_multiple: 1.20
  tp1_r_multiple: 1.50
  tp2_r_multiple: 2.50

notifications:
  macos: false
  telegram: true

reliability:
  enabled: true
  allow_fast: true  # User-approved filtered B+ Telegram alerts alongside A-tier.
  max_active_signals: 3
  max_active_per_type: 2
  max_total_risk_pct: 2.0
  max_spread_r: 0.20
  monitor_seconds: 60
  entry_delivery_ttl_seconds: 45
  max_signal_minutes: 180
  td_daily_credits: 800
  td_minute_credits: 8
  monitor_reserve_minutes: 30
  telegram_controls: true
  report_slippage_r: 0.10  # Sensitivity assumption, NOT measured execution slippage.

news:
  poll_seconds: 120
  max_age_seconds: 600
  calendar_poll_seconds: 3600
  calendar_max_age_seconds: 7200
  before_minutes: 30
  after_minutes: 45
  headline_pause_minutes: 45

watchlist:
  # US stocks — Yahoo 5-minute data
  - {symbol: NVDA, name: NVIDIA, type: stock}
  - {symbol: TSLA, name: Tesla, type: stock}
  - {symbol: PLTR, name: Palantir, type: stock}
  - {symbol: AMD, name: AMD, type: stock}
  - {symbol: META, name: Meta, type: stock}
  - {symbol: AMZN, name: Amazon, type: stock}
  - {symbol: AAPL, name: Apple, type: stock}
  - {symbol: MSFT, name: Microsoft, type: stock}
  - {symbol: GOOGL, name: Alphabet, type: stock}
  - {symbol: AVGO, name: Broadcom, type: stock}
  - {symbol: MU, name: Micron, type: stock}
  - {symbol: ARM, name: Arm, type: stock}
  - {symbol: SMCI, name: Super Micro Computer, type: stock}
  - {symbol: COIN, name: Coinbase, type: stock}
  - {symbol: MSTR, name: Strategy, type: stock}
  - {symbol: HOOD, name: Robinhood, type: stock}
  - {symbol: SOFI, name: SoFi, type: stock}
